.mobileOnly{display:none}
@media(max-width:600px){
  html,body{
    margin:0!important;
    width:100%!important;
    overflow-x:hidden!important;
    background:#eaf8fb!important;
  }
  body{display:block!important}
  .page{
    width:100%!important;
    max-width:none!important;
    min-height:100vh!important;
    margin:0!important;
    box-shadow:none!important;
    overflow:hidden!important;
    background:#eaf8fb!important;
    line-height:normal!important;
  }

  /* Su telefono NON usiamo il poster desktop né i suoi hotspot */
  .poster,.hot,.fix{display:none!important}

  .mobileOnly{
    display:block!important;
    width:100%!important;
    position:relative!important;
    line-height:1.25!important;
  }

  .mHero{
    display:block;
    width:100%;
    height:auto;
    margin:0;
  }

  .mQuick{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:12px;
    padding:10px;
    background:#fff;
    border:1px solid #d7edf2;
    border-radius:22px;
    box-shadow:0 8px 24px rgba(7,72,92,.14);
  }
  .mQuick button{
    min-height:92px;
    border:1px solid #d9edf1;
    background:linear-gradient(145deg,#fff,#effbfc);
    border-radius:17px;
    padding:10px 8px;
    color:#073958;
    font-family:inherit;
    text-align:center;
    cursor:pointer;
  }
  .mQuick .ico{
    display:grid;
    place-items:center;
    width:38px;height:38px;
    margin:0 auto 7px;
    border-radius:50%;
    background:#dff7f9;
    color:#078fa5;
    font-size:20px;
    font-weight:900;
  }
  .mQuick strong{
    display:block;
    font-size:12px;
    line-height:1.12;
    font-weight:900;
  }
  .mQuick small{
    display:block;
    margin-top:4px;
    color:#667d87;
    font-size:10px;
    line-height:1.18;
  }
  .mQuick .contact small{color:#078fa5;font-weight:900}

  .mHeading{
    margin:18px 16px 12px;
    color:#073958;
  }
  .mHeading small{
    display:block;
    color:#0a98aa;
    font-weight:900;
    font-size:10px;
    letter-spacing:.12em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .mHeading h2{
    margin:0;
    font-size:27px;
    line-height:1.05;
  }

  .mGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:11px;
    padding:0 12px 16px;
  }
  .mCard{
    padding:0;
    overflow:hidden;
    border:1px solid #d9ebef;
    border-radius:20px;
    background:#fff;
    box-shadow:0 6px 18px rgba(7,72,92,.10);
    color:#073958;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    min-width:0;
  }
  .mCard img{
    display:block;
    width:100%;
    height:118px;
    object-fit:cover;
  }
  .mCard .ct{
    padding:11px 11px 13px;
  }
  .mCard strong{
    display:block;
    font-size:15px;
    line-height:1.08;
    font-weight:900;
    margin-bottom:5px;
  }
  .mCard p{
    margin:0 0 10px;
    color:#627984;
    font-size:11px;
    line-height:1.3;
  }
  .mCard .go{
    color:#078fa5;
    font-size:11px;
    font-weight:900;
  }
  .mCard.full{
    grid-column:1/-1;
    display:grid;
    grid-template-columns:42% 58%;
    min-height:165px;
  }
  .mCard.full img{height:100%}
  .mCard.full .ct{display:flex;flex-direction:column;justify-content:center}

  .mReview{
    width:calc(100% - 24px);
    margin:0 12px 14px;
    border:0;
    border-radius:20px;
    padding:17px;
    background:linear-gradient(135deg,#073f60,#087f96);
    color:#fff;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
  }
  .mReview .stars{display:block;color:#ffd05a;font-size:19px;letter-spacing:1px}
  .mReview strong{display:block;font-size:17px;margin:4px 0}
  .mReview small{font-size:11px;opacity:.9}

  .mFooter{
    background:#087f96;
    color:#fff;
    text-align:center;
    padding:15px 16px calc(18px + env(safe-area-inset-bottom));
    font-size:11px;
    line-height:1.45;
  }

  .langfab{
    position:absolute!important;
    top:10px!important;
    right:10px!important;
    z-index:40!important;
  }
  .langmenu{
    position:absolute!important;
    top:50px!important;
    right:10px!important;
    z-index:41!important;
  }

  .modal{padding:0!important;align-items:flex-end!important}
  .sheet{
    width:100%!important;
    max-width:100%!important;
    max-height:92vh!important;
    border-radius:25px 25px 0 0!important;
    padding:19px 14px calc(22px + env(safe-area-inset-bottom))!important;
  }
  .sheet h2{font-size:24px!important}
  .actions a,.actionBtn{min-height:44px!important}
  .placePhoto{height:190px!important}
}

@media(max-width:350px){
  .mGrid{grid-template-columns:1fr}
  .mCard.full{grid-template-columns:1fr}
  .mCard.full img{height:145px}
}

function photoFor(name){
 const p=PHOTO[name];
 if(!p)return '';
 return `<img class="placePhoto" src="${p.src}" alt="${name}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='none'"><span class="photoCredit">${p.url?`<a href="${p.url}" target="_blank" rel="noopener">${p.credit}</a>`:p.credit}</span>`;
}

function card(name,desc,query,phone,extra='',opts={}){return `<div class="item ${opts.featured?'featured':''}">${photoFor(name)}${opts.kicker?`<span class="kicker">${opts.kicker}</span>`:''}<b>${name}</b>${desc?`<span>${desc}</span>`:''}${extra||''}<div class="actions">${query?a(map(query),T[LANG].map):''}${phone?tel(phone,`${T[LANG].call} ${phone}`):''}${opts.wa?wa(phone,T[LANG].wa):''}${opts.url?a(opts.url,opts.urlLabel||T[LANG].open,'alt'):''}</div></div>`}

const modal=document.getElementById('modal'),mt=document.getElementById('mt'),ms=document.getElementById('ms'),mb=document.getElementById('mb');
let currentKey=null;
function openKey(key){currentKey=key;const d=render(key);mt.textContent=d.title;ms.textContent=d.sub||'';mb.innerHTML=d.body;modal.classList.add('on');document.body.style.overflow='hidden';}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openKey(b.dataset.open)));
function shut(){modal.classList.remove('on');document.body.style.overflow='';currentKey=null}document.getElementById('close').onclick=shut;modal.addEventListener('click',e=>{if(e.target===modal)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
